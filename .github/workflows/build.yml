name: Build Windows EXE

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: # Ti permette di avviare la compilazione manualmente

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout del codice
      uses: actions/checkout@v4

    - name: Configurazione Node.js
      uses: actions/setup-node@v4
      with:
        node-size: 20
        cache: 'npm'

    - name: Installazione Dipendenze
      run: npm install

    - name: Compilazione con Electron Packager
      run: |
        npm install electron-packager --save-dev
        npx electron-packager . piper-electron --platform=win32 --arch=x64 --out=dist --overwrite

    - name: Caricamento dell'eseguibile (Artifact)
      uses: actions/upload-artifact@v4
      with:
        name: piper-electron-windows
        path: dist/
